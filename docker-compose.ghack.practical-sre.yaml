services:
  db:
    image: pgvector/pgvector:pg17
    ports:
    - 5432:5432
    restart: always
    environment:
      POSTGRES_PASSWORD: main
    volumes:
      - ./utils/pgvector/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  adminer:
    image: adminer
    restart: always
    ports:
      - 8082:8080
  cache:
    image: redis:6.2-alpine
    restart: always
    command: redis-server --save 20 1 --loglevel warning
  nginx:
    image: nginx:latest
    restart: always
    ports:
      - 8080:80
    volumes:
      - ./utils/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - frontend
  flows:
    build: ./code/genkitFlows
    environment:
      - PROJECT_ID=${PROJECT_ID}
      - LOCATION=${REGION}
      - POSTGRES_HOST=db
      - POSTGRES_DB_USER=minimal-user
      - POSTGRES_DB_USER_PASSWORD=minimal
      - TABLE_NAME=movies
      - POSTGRES_DB_NAME=fake-movies-db
      - GOOGLE_APPLICATION_CREDENTIALS=/key.json
      - GRPC_TRACE=all
      - GRPC_VERBOSITY=ERROR
    volumes:
      - ./key.json:/key.json 
  server:
    build: 
      context: ./ghacks/practical-sre/webserver
      dockerfile: Dockerfile
    restart: always
    command: /app/webserver
    environment:
      - PROJECT_ID=${PROJECT_ID}
      - LOCATION=${REGION}
      - POSTER_BUCKET_NAME=${POSTER_BUCKET_NAME}
      - FEEDBACK_URL=${GENKIT_FEEDBACK_URL}
      - ENABLE_METRICS=${ENABLE_METRICS}
      - FLOWS_URL=${FLOWS_URL}
      - USE_AUTH=${USE_AUTH}
      - TOKEN_AUDIENCE=${TOKEN_AUDIENCE}
      - STRICT_CORS=${STRICT_CORS}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - MAX_USER_MESSAGE_LENGTH=${MAX_USER_MESSAGE_LENGTH}
      - HISTORY_LENGTH=${HISTORY_LENGTH}
      - POSTGRES_HOST=db
      - POSTGRES_DB_USER_PASSWORD=minimal
      - POSTGRES_DB_USER=minimal-user
      - POSTGRES_DB_NAME=fake-movies-db
      - TABLE_NAME=movies
      - REDIS_HOST=cache
      - REDIS_PORT=6379
    depends_on:
      - cache 
      - db
  frontend:
    build: 
      context: ./code/frontend
      dockerfile: Dockerfile.dev
    environment:
      - VITE_GCP_PROJECT_ID=${PROJECT_ID}
      - VITE_USE_AUTH=${USE_AUTH}
      - VITE_FIREBASE_API_KEY=${FIREBASE_API_KEY}
      - VITE_FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN}
      - VITE_FIREBASE_APP_ID=${FIREBASE_APP_ID}
      - VITE_CHAT_SERVER_URL=http://localhost:8080/api
  mock-server:
    build: 
      context: ./ghacks/practical-sre/webserver
      dockerfile: Dockerfile
    restart: always
    command: /app/mockserver
    ports:
      - 8084:8080
