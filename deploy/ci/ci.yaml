timeout: 7200s # 2hr
tags:
  - ci

steps:
- name: 'gcr.io/cloud-builders/docker'
  id: "build-db-init-image"
  dir: './pgvector'
  entrypoint: "sh"
  args:
    - -xe 
    - -c
    - |
      docker build \
         -t "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/movie-guru/db-init:sre-v2" \
         --cache-from "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/movie-guru/db-init:sre-v2" \
         -f Dockerfile.init \
         .

- name: 'gcr.io/cloud-builders/docker'
  id: "push-db-init-image"
  waitFor: [build-db-init-image]
  entrypoint: "sh"
  args:
    - -xe 
    - -c
    - |
      docker push '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/movie-guru/db-init:sre-v2'

- name: 'gcr.io/cloud-builders/docker'
  id: "build-db-image"
  dir: './pgvector'
  entrypoint: "sh"
  args:
    - -xe 
    - -c
    - |
      docker build \
         -t "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/movie-guru/db:sre-v2" \
         --cache-from "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/movie-guru/db:sre-v2" \
         -f Dockerfile \
         .

- name: 'gcr.io/cloud-builders/docker'
  id: "push-db-image"
  waitFor: [build-db-image]
  entrypoint: "sh"
  args:
    - -xe 
    - -c
    - |
      docker push '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/movie-guru/db:sre-v2'

- name: "gcr.io/cloud-builders/docker"
  id: "build-frontend"
  waitFor: ['-']
  dir: './frontend'
  entrypoint: "bash"
  args:
    - "-c"
    - |
      docker build \
        -t "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/movie-guru/frontend:sre-v2" \
        --cache-from "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/movie-guru/frontend:sre-v2" \
        .

- name: 'gcr.io/cloud-builders/docker'
  id: "push-frontend-image"
  waitFor: [build-frontend]
  entrypoint: "sh"
  args:
    - -xe 
    - -c
    - |
      docker push '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/movie-guru/frontend:sre-v2'

- name: 'gcr.io/cloud-builders/docker'
  id: "build-server-image"
  waitFor: ['-']
  dir: './chat_server_go'
  entrypoint: "sh"
  args:
    - -xe 
    - -c
    - |
      docker build \
         -t "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/movie-guru/chatserver:sre-v2" \
         --cache-from "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/movie-guru/chatserver:sre-v2" \
         .
- name: 'gcr.io/cloud-builders/docker'
  id: "push-server-image"
  waitFor: [build-server-image]
  entrypoint: "sh"
  args:
    - -xe 
    - -c
    - |
      docker push '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/movie-guru/chatserver:sre-v2'

- name: 'gcr.io/cloud-builders/docker'
  id: "build-flows-image"
  waitFor: ['-']
  dir: './js/flows'
  entrypoint: "sh"
  args:
    - -xe 
    - -c
    - |
      docker build \
         -t "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/movie-guru/flows:sre-v2" \
         --cache-from "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/movie-guru/flows:sre-v2" \
         .
- name: 'gcr.io/cloud-builders/docker'
  id: "push-flows-image"
  waitFor: [build-flows-image]
  entrypoint: "sh"
  args:
    - -xe 
    - -c
    - |
      docker push '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/movie-guru/flows:sre-v2'
- name: 'gcr.io/cloud-builders/docker'
  id: "build-mock-image"
  waitFor: ['-']
  dir: './js/mock-user'
  entrypoint: "sh"
  args:
    - -xe 
    - -c
    - |
      docker build \
         -t "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/movie-guru/mockuser:sre-v2" \
         --cache-from "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/movie-guru/mockuser:sre-v2" \
         .
- name: 'gcr.io/cloud-builders/docker'
  id: "push-mock-image"
  waitFor: [build-mock-image]
  entrypoint: "sh"
  args:
    - -xe 
    - -c
    - |
      docker push '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/movie-guru/mockuser:sre-v2'


options:
  logging: CLOUD_LOGGING_ONLY
  substitution_option: ALLOW_LOOSE
  dynamic_substitutions: true