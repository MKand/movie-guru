apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: otel-collector
spec:
  replicas: 2
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      serviceAccountName: otel-sa
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.106.0 
        args:
        - --config=/etc/otel/config.yaml
        ports:
        - containerPort: 4318
        volumeMounts:
        - name: otel-config
          mountPath: /etc/otel
      volumes:
      - name: otel-config
        configMap:
          name: otel-config

---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
  - protocol: TCP
    port: 4318
    targetPort: 4318
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-config
  namespace: otel-collector
data:
  config.yaml: |
    exporters:
      googlemanagedprometheus:

    processors:
      k8sattributes:
        extract:
          metadata:
          - k8s.namespace.name
          - k8s.deployment.name
          - k8s.statefulset.name
          - k8s.daemonset.name
          - k8s.cronjob.name
          - k8s.job.name
          - k8s.node.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.pod.start_time
        passthrough: false
        pod_association:
        - sources:
          - from: resource_attribute
            name: k8s.pod.ip
        - sources:
          - from: resource_attribute
            name: k8s.pod.uid
        - sources:
          - from: connection

      resourcedetection:
        detectors: [gcp]
        timeout: 10s
        override: false

      transform:
        metric_statements:
        - context: datapoint
          statements:
                - set(attributes["exported_location"], attributes["location"])
                - delete_key(attributes, "location")
                - set(attributes["exported_cluster"], attributes["cluster"])
                - delete_key(attributes, "cluster")
                - set(attributes["exported_namespace"], attributes["namespace"])
                - delete_key(attributes, "namespace")
                - set(attributes["exported_job"], attributes["job"])
                - delete_key(attributes, "job")
                - set(attributes["exported_instance"], attributes["instance"])
                - delete_key(attributes, "instance")
                - set(attributes["exported_project_id"], attributes["project_id"])
                - delete_key(attributes, "project_id")

      batch:
        send_batch_max_size: 200
        send_batch_size: 200
        timeout: 9s

      memory_limiter:
        check_interval: 1s
        limit_percentage: 65
        spike_limit_percentage: 20

    receivers:
      otlp:
        protocols:
          http:
            endpoint: "0.0.0.0:4318"
      prometheus:
        config:
          scrape_configs:
          - job_name: 'movie-guru-server'
            kubernetes_sd_configs:
            - role: pod
            relabel_configs:
            - source_labels: [__meta_kubernetes_pod_label_cluster]
              target_label: cluster
            - source_labels: [__meta_kubernetes_pod_label_job]
              target_label: job
            - source_labels: [__meta_kubernetes_namespace]
              target_label: namespace
            - source_labels: [__meta_kubernetes_pod_label_location]
              target_label: location
            - source_labels: [__address__]
              target_label: instance
            - source_labels: [__meta_kubernetes_pod_name]
              target_label: pod_name
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
              action: keep
              regex: prom-example
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
              action: replace
              regex: (.+):(?:\d+);(\d+)
              replacement: $$1:$$2
              target_label: __address__
            - action: labelmap
              regex: __meta_kubernetes_pod_label_(.+)

    service:
      pipelines:
        metrics:
          receivers: ["otlp"]
          processors: [batch, memory_limiter, resourcedetection, transform, k8sattributes]
          exporters: [googlemanagedprometheus]
      telemetry:
          logs:
            level: info # debug
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: otel-collector
  namespace: otel-collector
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: server
  minReplicas: 2
  maxReplicas: 25
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: otel-collector-pdb
  namespace: otel-collector
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app: otel-collector       
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
rules:
- apiGroups: [""]
  resources: ["pods", "namespaces", "nodes"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["extensions"]
  resources: ["replicasets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector
subjects:
- kind: ServiceAccount
  name: otel-sa
  namespace: otel-collector
roleRef:
  kind: ClusterRole
  name: otel-collector
  apiGroup: rbac.authorization.k8s.io