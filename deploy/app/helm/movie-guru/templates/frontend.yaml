apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: movieguru
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      svc: frontend
  template:
    metadata:
      labels:
        app: frontend
        svc: frontend
    spec:
      containers:
      - name: frontend
        image: "{{ .Values.Config.Image.Repository }}/frontend:sre-v2"
        imagePullPolicy: Always
        ports:
        - containerPort: 5173
        env:
        - name: VITE_CHAT_SERVER_URL
          value: "http://{{ .Values.Config.serverIP }}"
        - name: VITE_FIREBASE_API_KEY
          value: "{{ .Values.Config.FIREBASE_API_KEY }}"
        - name: VITE_FIREBASE_APP_ID
          value: "{{ .Values.Config.FIREBASE_APP_ID }}"
        - name: VITE_GCP_PROJECT_ID
          value: "{{ .Values.Config.projectID }}"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: movieguru
spec:
  selector:
    svc: frontend 
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5173
  type: LoadBalancer
  loadBalancerIP: {{ .Values.Config.frontendIP }}