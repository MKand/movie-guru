apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: movieguru
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: "{{ .Values.Config.Image.Repository }}/frontend:sre-v2"
        imagePullPolicy: Always
        ports:
        - containerPort: 4001
        env:
        - name: VITE_CHAT_SERVER_URL
          value: "{{ .Values.Config.serverAddress }}"
        - name: VITE_FIREBASE_API_KEY
          value: "{{ .Values.Config.FIREBASE_API_KEY }}"
        - name: VITE_FIREBASE_APP_ID
          value: "{{ .Values.Config.FIREBASE_APP_ID }}"
        - name: VITE_GCP_PROJECT_ID
          value: "{{ .Values.Config.projectID }}"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: movieguru
spec:
  selector:
    app: frontend 
  ports:
  - protocol: TCP
    port: 80
    targetPort: 4001
  type: ClusterIP

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
  namespace: movieguru
spec:
  parentRefs:
    - name: movieguru-gateway
      namespace: movieguru
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      backendRefs:
        - name: frontend-service
          port: 80