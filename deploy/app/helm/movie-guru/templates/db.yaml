apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: movieguru
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: pgvector/pgvector:pg17
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_PASSWORD
          value: main
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init-job
  namespace: movieguru
spec: 
  template:
    metadata:
      labels:
        app: db-init
    spec: 
      containers:
      - name: update-db-init-image
        image: "{{ .Values.Config.Image.Repository }}/db-init:sre-v2"
        env:
        - name: DB_HOST
          value: "db-service.movieguru.svc.cluster.local"
        - name: DB_USER
          value: main
        - name: DB_NAME
          value: fake-movies-db
        - name: DB_PASS
          value: main
      restartPolicy: Never #
  backoffLimit: 4 
---
apiVersion: v1
kind: Service
metadata:
  name: db-service
  namespace: movieguru
spec:
  selector:
    app: db 
  ports:
  - protocol: TCP
    port: 5432  
    targetPort: 5432
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: movieguru
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adminer
  template:
    metadata:
      labels:
        app: adminer
    spec:
      containers:
        - name: adminer
          image: adminer
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: adminer
  namespace: movieguru
spec:
  selector:
    app: adminer 
  ports:
  - protocol: TCP
    port: 8082  
    targetPort: 8080
  type: ClusterIP