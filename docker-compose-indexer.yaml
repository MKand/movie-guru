services:
  indexer-js:
    build: ./js/indexer
    environment:
      - PROJECT_ID=$PROJECT_ID
      - POSTGRES_DB_USER_PASSWORD=main
      - POSTGRES_DB_USER=main
      - POSTGRES_HOST=db
      - POSTGRES_DB_NAME=fake-movies-db
      - TABLE_NAME=movies
      - GOOGLE_APPLICATION_CREDENTIALS=/key.json
      - LOCATION=us-central1
    volumes:
      - ./key.json:/key.json
      - ./dataset/:/dataset
    networks:
      - db-shared-network
networks:
  db-shared-network:
    external: true
 
  