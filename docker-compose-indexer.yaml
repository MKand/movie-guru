services:
  indexer-js:
    build: ./js/indexer
    environment:
      - PROJECT_ID=$PROJECT_ID
      - POSTGRES_HOST=localhost
      - POSTGRES_DB_USER=main
      - POSTGRES_DB_USER_PASSWORD=main
      - TABLE_NAME=movies
      - POSTGRES_DB_NAME=fake-movies-db
      - GOOGLE_APPLICATION_CREDENTIALS=/key.json
      - LOCATION=$REGION
    volumes:
      - ./.key.json:/key.json
      - ./dataset/:/dataset
 
  