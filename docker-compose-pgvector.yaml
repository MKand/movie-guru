services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: main
      restart: always
    volumes:
      - ./pgvector/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - db-shared-network
  adminer:
    image: adminer
    restart: always
    ports:
      - 8082:8080
    networks:
      - db-shared-network
networks:
  db-shared-network:
    external: true

  