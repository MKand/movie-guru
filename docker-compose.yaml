services:
  cache:
    image: redis:6.2-alpine
    restart: always
    command: redis-server --save 20 1 --loglevel warning 
    networks:
      - db-shared-network
  flows:
    build: ./js/flows
    environment:
      - PROJECT_ID=$PROJECT_ID
      - LOCATION=$REGION
      - POSTGRES_HOST=db
      - POSTGRES_DB_USER=minimal-user
      - POSTGRES_DB_USER_PASSWORD=minimal
      - TABLE_NAME=movies
      - POSTGRES_DB_NAME=fake-movies-db
      - GOOGLE_APPLICATION_CREDENTIALS=/key.json
      - GRPC_TRACE=all
      - GRPC_VERBOSITY=DEBUG
    volumes:
      - ./.key.json:/key.json
    networks:
      - db-shared-network    
  server:
    build: ./chat_server_go
    restart: always
    command: /app/webserver
    environment:
      - PROJECT_ID=$PROJECT_ID      
      - LOCATION=$REGION
      - POSTGRES_HOST=db
      - POSTGRES_DB_USER_PASSWORD=minimal
      - POSTGRES_DB_USER=minimal-user
      - POSTGRES_DB_NAME=fake-movies-db
      - TABLE_NAME=movies
      - APP_VERSION=v1_local
      - USE_AUTH=false
      - CORS_STRICT=false # allows any origin to get through
      - FLOWS_URL=http://flows:3400
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - FEEDBACK_URL=https://${GENKIT_FEEDBACK_REGION}-${PROJECT_ID}.cloudfunctions.net/ext-firebase-ai-user-engagement-collectEngagement

    depends_on:
      - cache 
    networks:
      - movie-guru
      - db-shared-network
  frontend:
    build: ./frontend
    environment:
      - VITE_FIREBASE_API_KEY=${FIREBASE_API_KEY}
      - VITE_FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN}
      - VITE_GCP_PROJECT_ID=${PROJECT_ID}
      - VITE_FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET}
      - VITE_FIREBASE_MESSAGING_SENDERID=${FIREBASE_MESSAGING_SENDERID}
      - VITE_FIREBASE_APPID=${FIREBASE_APPID}
      - VITE_CHAT_SERVER_URL=http://localhost:8080/api
    networks:
      - movie-guru
  nginx:
    image: nginx:latest
    restart: always
    ports:
      - 8080:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - frontend
    networks:
      - movie-guru
networks:
  db-shared-network:
    external: true
  movie-guru: 
    driver: bridge