services:
  db:
    image: pgvector/pgvector:pg17
    ports:
    - 5432:5432
    restart: always
    environment:
      POSTGRES_PASSWORD: main
    volumes:
      - ./utils/pgvector/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  adminer:
    image: adminer
    restart: always
    ports:
      - 8082:8080
  cache:
    image: redis:6.2-alpine
    restart: always
    command: redis-server --save 20 1 --loglevel warning
  nginx:
    image: nginx:latest
    restart: always
    ports:
      - 8080:80
    volumes:
      - ./utils/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - frontend
  flows:
    build: ./code/genkitFlows
    environment:
      - PROJECT_ID=$PROJECT_ID
      - LOCATION=$REGION
      - POSTGRES_HOST=db
      - POSTGRES_DB_USER=minimal-user
      - POSTGRES_DB_USER_PASSWORD=minimal
      - TABLE_NAME=movies
      - POSTGRES_DB_NAME=fake-movies-db
      - GOOGLE_APPLICATION_CREDENTIALS=/key.json
      - GRPC_TRACE=all
      - GRPC_VERBOSITY=ERROR
    volumes:
      - ./key.json:/key.json 
  server:
    build: ./code/webserver
    restart: always
    command: /app/webserver
    environment:
      - PROJECT_ID=$PROJECT_ID      
      - LOCATION=$REGION
      - FEEDBACK_URL=$GENKIT_FEEDBACK_URL
      - POSTGRES_HOST=db
      - POSTGRES_DB_USER_PASSWORD=minimal
      - POSTGRES_DB_USER=minimal-user
      - POSTGRES_DB_NAME=fake-movies-db
      - TABLE_NAME=movies
      - USE_AUTH=false
      - STRICT_CORS=false
      - FLOWS_URL=http://flows:3400
      - REDIS_HOST=cache
      - REDIS_PORT=6379
    depends_on:
      - cache 
      - db
  frontend:
    build: 
      context: ./code/frontend
      dockerfile: Dockerfile.dev
    environment:
      - VITE_GCP_PROJECT_ID=$PROJECT_ID
      - VITE_USE_AUTH=false
      - VITE_CHAT_SERVER_URL=http://localhost:8080/api